[package]
name = "meowsystem-eyedropper"
version = "0.6.3"
edition = "2024"
license = "MPL-2.0"
authors = ["nalladev (upstream)", "Vitória Maria", "André Farias"]
description = "Eyedropper applet for cosmic desktop. Pick colours from the screen. A fork of nalladev/cosmic-ext-applet-eyedropper themed by MeowSystem."
repository = "https://github.com/vitoriamariadb/meowsystem-eyedropper"

[dependencies]
anyhow = "1"
ashpd = "0.12"
env_logger = "0.11"
futures-util = "0.3.31"
i18n-embed-fl = "0.10"
image = "0.25"
log = "0.4"
rust-embed = "8.7.2"
rustix = { version = "1", features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["full"] }
zbus = { version = "5.15", default-features = false, features = ["blocking-api", "tokio"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # D-Bus activation support (--pick forwards to a running instance).
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[package.metadata.deb]
license-file = "LICENSE"
assets = [
  ["target/release/meowsystem-eyedropper", "usr/bin/", "755"],
  ["resources/io.github.meowsystem.Eyedropper.desktop", "usr/share/applications/io.github.meowsystem.Eyedropper.desktop", "644"],
  ["resources/io.github.meowsystem.Eyedropper.metainfo.xml", "usr/share/appdata/io.github.meowsystem.Eyedropper.metainfo.xml", "644"],
  ["resources/io.github.meowsystem.Eyedropper-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/io.github.meowsystem.Eyedropper-symbolic.svg", "644"],

]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/meowsystem-eyedropper", dest = "/usr/bin/meowsystem-eyedropper", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/doc/meowsystem-eyedropper/LICENSE", doc = true, mode = "644" },
  { source = "resources/io.github.meowsystem.Eyedropper.desktop", dest = "/usr/share/applications/io.github.meowsystem.Eyedropper.desktop", mode = "644" },
  { source = "resources/io.github.meowsystem.Eyedropper.metainfo.xml", dest = "/usr/share/appdata/io.github.meowsystem.Eyedropper.metainfo.xml", mode = "644" },
  { source = "resources/io.github.meowsystem.Eyedropper-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.meowsystem.Eyedropper-symbolic.svg", mode = "644" },

]
